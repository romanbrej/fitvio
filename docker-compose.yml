# Health Wall on Docker (e.g. a Raspberry Pi 4 with 64-bit OS).
# The image is built by GitHub Actions on every push to main (.github/workflows/build.yml) and pushed to
# GHCR; a systemd timer on the Pi pulls it and restarts web + sync within 5 min
# (deploy/install-autoupdate.sh). See README "Raspberry Pi + tablet".
#   docker compose pull && docker compose up -d   start / apply compose changes
#   docker compose up -d --build                  build locally instead (uses the same image name)
#   docker compose logs -f sync                   watch the Garmin sync
# Data and settings stay on the host in ./data and ./config (credentials, tokens, health data).
# Set HW_UID / HW_GID in .env to the host user owning those folders (id -u / id -g).
# Rollback: HW_TAG=sha-<commit> in .env, then docker compose up -d (the auto-update then keeps that tag).

x-common: &common
  image: ghcr.io/romanbrej/fitness-dashboard:${HW_TAG:-latest}
  user: "${HW_UID:-1000}:${HW_GID:-1000}"
  environment:
    TZ: ${TZ:-Europe/Berlin}
  volumes:
    - ./data:/app/data
    - ./config:/app/config
  restart: unless-stopped

services:
  web:
    <<: *common
    build: .
    command: ["healthdash", "serve", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  sync:
    <<: *common
    # auto-sync: checks Garmin for a new activity every 2 min (05:00–24:00) and syncs right away;
    # full differential sync (health data) hourly. Switch the check off in Accounts.
    command: ["healthdash", "watch"]
    depends_on:
      - web

