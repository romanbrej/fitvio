# Test, then build the multi-arch image (amd64 + arm64) and push it to GHCR.
# Servers update themselves: deploy/install-updater.sh pulls a newer image every few minutes.
# (No self-hosted runner on purpose: on a public repo it would let pull requests run code on your server.)
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'design-system/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

# least privilege: jobs get a read-only token unless they ask for more (the image job needs packages: write)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend[dev]'
      - run: pytest
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm can stall on IPv6 and die with "Exit handler never called" → prefer IPv4 and retry once (as in Dockerfile)
      - run: npm ci --no-audit --no-fund || (sleep 5 && npm ci --no-audit --no-fund)
        working-directory: frontend
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
      - run: npm run lint
        working-directory: frontend

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # one plain manifest per build (no attestation index) → one package version per push
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # keep the registry small (stays inside the free tier); older sha- tags can't be rolled back to
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          # a multi-arch push stores 3 versions (index + one manifest per platform): 15 = the last 5 builds
          min-versions-to-keep: 15
