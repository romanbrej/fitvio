# Test, then build the image (platform below: set it to your server's) and push it to the container registry.
# Then the optional `deploy` job runs on the server (self-hosted runner, deploy/install-runner.sh) and restarts the app.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'design-system/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend[dev]'
      - run: pytest
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm can stall on IPv6 and die with "Exit handler never called" → prefer IPv4 and retry once (as in Dockerfile)
      - run: npm ci --no-audit --no-fund || (sleep 5 && npm ci --no-audit --no-fund)
        working-directory: frontend
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
      - run: npm run lint
        working-directory: frontend

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # one plain manifest per build (no attestation index) → one package version per push
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # keep the registry small (stays inside the free tier); older sha- tags can't be rolled back to
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5

  deploy:
    needs: image
    runs-on: [self-hosted, pi]
    concurrency: deploy
    steps:
      - name: Pull latest image and restart
        run: |
          cd "$HOME/health-wall"
          docker compose pull --quiet
          docker compose up -d --no-build --remove-orphans
          docker image prune -f
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS -m 5 http://127.0.0.1:8765/api/health && exit 0
            sleep 2
          done
          echo "web did not become healthy" >&2
          cd "$HOME/health-wall" && docker compose ps && docker compose logs --tail 50 web
          exit 1
